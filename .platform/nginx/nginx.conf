user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    client_header_timeout 60;
    client_body_timeout   60;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    # Gzip 설정 (필요시 on으로 변경)
    gzip off;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # WebSocket 및 Connection 업그레이드 매핑
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    include /etc/nginx/conf.d/*.conf;


    # HTTP -> HTTPS 리다이렉트
    server {
        listen 80;
        listen [::]:80;

        server_name dldm.kr;

        # Let's Encrypt 인증서 갱신용
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }

        return 301 https://$host$request_uri;
    }


    # HTTPS (HTTP/1.1, HTTP/2, HTTP/3 QUIC) 서버
    server {
        # HTTP/1.1 & TLS
        listen 443 ssl;
        listen [::]:443 ssl;

        # HTTP/2 활성화 (Nginx 1.25.1+)
        http2 on;

        # HTTP/3 (QUIC) UDP 포트 개방
        listen 443 quic reuseport;
        listen [::]:443 quic reuseport;

        server_name dldm.kr;

        root /usr/share/nginx/html;

        # SSL / TLS 설정 (HTTP/3는 TLS 1.3 필수)
        ssl_certificate /etc/letsencrypt/live/dldm.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dldm.kr/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 10m;

        ssl_ciphers PROFILE=SYSTEM;
        ssl_prefer_server_ciphers on;

        # 브라우저에게 HTTP/3 지원을 알리는 Alt-Svc 헤더
        add_header Alt-Svc 'h3=":443"; ma=86400';

        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }

        include conf.d/elasticbeanstalk/*.conf;
    }
}